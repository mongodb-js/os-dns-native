# This action runs lint checks and tests against the code.
name: Check and Test

on:
  pull_request:

  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-test:
    name: Check and Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x, 26.x]

    # This package shells out to the WiX toolset, so Windows is the only
    # platform it makes sense to test on.
    runs-on: ${{ matrix.os }}

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Use a faster DNS resolver for failures in Mac.
        if: runner.os == 'macOS'
        run: |
          SERVICE=$(networksetup -listallnetworkservices | tail -n +2 | head -n 1)
          sudo networksetup -setdnsservers "$SERVICE" 1.1.1.1 1.0.0.1
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder

      - name: Test
        run: npm run test
